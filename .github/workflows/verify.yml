name: Prüfung Rechenkern
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typprüfung
        run: npx tsc --noEmit
      - name: Tests (golden.json, Grenzfälle, Auslegungswerte, Bemessen, Ashby)
        run: npx vitest run
      - name: Formelkatalog aktuell
        run: npx tsx scripts/formelkatalog.ts --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r verification/requirements.txt
      - name: Unabhängige Gegenrechnung (Python)
        run: python3 verification/pruefung.py
